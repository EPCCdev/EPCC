name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install window system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        # An older Ubuntu, so the Linux build also runs on older distributions.
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install window system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Add the Intel target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: Build and package
        shell: bash
        run: ./scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          name: EPCC ${{ github.ref_name }}
          body: |
            Download the file for your computer, unpack it and start EPCC. No installation needed.

            * Windows: EPCC-windows-x64.zip
            * macOS (Apple silicon and Intel): EPCC-macos.zip
            * Linux: EPCC-linux-x64.tar.gz

            See the README for first-start notes and instructions.
          files: dist/EPCC-*
