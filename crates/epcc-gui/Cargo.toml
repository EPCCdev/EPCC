[package]
name = "epcc-gui"
description = "Desktop front end of EPCC."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
epcc-core = { path = "../epcc-core" }
rfd = "0.17.2"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
