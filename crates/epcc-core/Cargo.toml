[package]
name = "epcc-core"
description = "Point cloud format conversion: shared point model, format readers and writers, reduction."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
e57 = { version = "0.11.13", features = ["crc32c"] }
fast-float2 = "0.2.4"
las = { version = "0.11.2", features = ["laz-parallel"] }
laz = "0.13.0"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.8"
